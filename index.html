<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>NC</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <select id="mode"></select>
        <button id="new">NEW</button>
        <button id="check">CHECK</button>
        <button id="print">PRINT</button>
        <label class="toggle"><input type="checkbox" id="testmode"><span>testmode</span></label>
    </header>
    <main class="container">
        <div class="task-header">
            <div class="top">
                <div id="difficulty"></div>
            </div>
            <div class="bottom">
                <div>
                    <div id="task"></div>
                    <div id="hint"></div>
                </div>
                <div id="solution"></div>
            </div>
        </div>
        <div class="field">
            <aside id="numbers"></aside>
            <div id="grid"></div>
        </div>
    </main>

    <script src="modes.js"></script>
    <script src="app.js"></script>
</body>

</html>
